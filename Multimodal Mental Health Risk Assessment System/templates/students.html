<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Students | Mental Health Support Center</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/ui-enhancements.css">
</head>
<body>

{% include "_navbar.html" %}

<div class="page-container">
    <div class="welcome-section">
        <h2>Students</h2>
        <p>List of all students who have completed an assessment in this system</p>
    </div>

    <!-- Filters -->
    <div class="filters-row">
        <select id="filter-department"><option value="">All Departments</option></select>
        <select id="filter-semester"><option value="">All Semesters</option></select>
        <select id="filter-section"><option value="">All Sections</option></select>
        <select id="filter-batch"><option value="">All Batches</option></select>
    </div>

    <!-- Student Table -->
    <table class="student-table">
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody id="students-table-body">
            <!-- JS দিয়ে সব row এখানে বসবে -->
        </tbody>
    </table>
</div>

<script src="/static/js/students.js"></script>



{% include "_footer.html" %}



</body>
</html>
