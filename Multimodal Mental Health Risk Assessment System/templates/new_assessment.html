<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>New Assessment | Mental Health Support Center</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/ui-enhancements.css">
</head>
<body>

{% include "_navbar.html" %}

<div class="page-container">
    <div class="welcome-section">
        <h2>New Assessment</h2>
        <p>Choose whether the student is new or already exists</p>
    </div>

    <!-- ================= STEP A: New vs Existing ================= -->
    <div id="choice-step">
        <div class="choice-cards">
            <div class="choice-card" id="existing-student-card">
                <div class="icon">🔎</div>
                <h4>Existing Student</h4>
                <p style="font-size:12px;color:#9ca3af;margin-top:6px;">Search by Student ID</p>
            </div>
            <div class="choice-card" id="new-student-card">
                <div class="icon">🆕</div>
                <h4>New Student</h4>
                <p style="font-size:12px;color:#9ca3af;margin-top:6px;">Enter the information again</p>
            </div>
        </div>
    </div>

    <!-- ================= STEP B1: Existing Student Search ================= -->
    <div id="existing-step" class="hidden">
        <div class="search-card">
            <h3>Search by Student ID</h3>
            <div class="search-box-row">
                <input type="text" id="existing-student-id" placeholder="Enter Student ID...">
                <button id="existing-search-btn">Search</button>
            </div>
            <div class="error-text hidden" id="existing-error">Student not found!</div>

            <!-- খোঁজা student পাওয়া গেলে এখানে card আকারে দেখানো হবে -->
            <div id="found-student-box" class="hidden" style="margin-top:20px;">
                <div class="info-card" id="found-student-card" style="cursor:pointer;">
                    <!-- JS দিয়ে বসবে -->
                </div>
            </div>
        </div>
    </div>

    <!-- ================= STEP B2: New Student Form ================= -->
    <div id="new-student-step" class="hidden">
        <div class="info-card">
            <h3>Student Information</h3>
            <div class="info-grid" style="margin-top:14px;">
                <div class="form-group"><label>Student ID</label><input type="text" id="ns-student-id"></div>
                <div class="form-group"><label>Student Name</label><input type="text" id="ns-name"></div>
                <div class="form-group"><label>Email</label><input type="text" id="ns-email"></div>
                <div class="form-group"><label>Phone Number</label><input type="text" id="ns-phone"></div>
                <div class="form-group"><label>Department</label><input type="text" id="ns-department"></div>
                <div class="form-group"><label>Batch</label><input type="text" id="ns-batch"></div>
                <div class="form-group"><label>Semester</label><input type="text" id="ns-semester"></div>
                <div class="form-group"><label>Section</label><input type="text" id="ns-section"></div>
                <div class="form-group"><label>Blood Group</label><input type="text" id="ns-blood-group"></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" id="ns-dob"></div>
                <div class="form-group"><label>Age</label><input type="number" id="ns-age"></div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="ns-gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" style="margin-top:18px;" id="save-new-student-btn">Next →</button>
            <div class="error-text hidden" id="new-student-error"></div>
        </div>
    </div>

</div>

<script src="/static/js/new_assessment.js"></script>

{% include "_footer.html" %}

</body>
</html>
