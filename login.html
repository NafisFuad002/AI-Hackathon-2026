<!--
    login.html
    -----------
    লগইন পেজ। এখানে ৩টা "স্টেপ" (step) আছে যেগুলো JavaScript দিয়ে
    show/hide করা হয়:
      1) login-step        -> সাধারণ email/password লগইন ফর্ম
      2) security-step      -> forgot password এর security question ফর্ম
      3) reset-step         -> সঠিক উত্তরের পর নতুন password সেট করার ফর্ম
-->
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Login | Mental Health Assessment System</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/ui-enhancements.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">

        <!-- ================= STEP 1: NORMAL LOGIN ================= -->
        <div id="login-step">
            <div class="logo">🧠 Mental Health Support Center</div>
            <div class="tagline">Student Mental Health Assessment System</div>

            <div class="form-group">
                <label>Email / Username</label>
                <input type="text" id="login-email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>

            <div class="form-row-between">
                <label><input type="checkbox" id="remember-me"> Remember me</label>
                <a href="#" id="forgot-password-link" style="color:#4f46e5;">Forgot password?</a>
            </div>

            <button class="btn-primary" id="login-btn">Login</button>

            <div class="error-text hidden" id="login-error"></div>
        </div>

        <!-- ============ STEP 2: SECURITY QUESTION (Forgot Password) ============ -->
        <div id="security-step" class="hidden">
            <div class="logo">🔒 Account Recovery</div>
            <p class="tagline">Verify the Security Question using your email</p>

            <div id="security-email-box">
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" id="recovery-email" placeholder="you@example.com">
                </div>
                <button class="btn-primary" id="get-question-btn">Continue</button>
            </div>

            <div id="security-question-box" class="hidden">
                <div class="form-group">
                    <label id="security-question-text"></label>
                    <input type="text" id="security-answer-input" placeholder="Your answer">
                </div>
                <button class="btn-primary" id="submit-answer-btn">Verify Answer</button>
            </div>

            <div class="error-text hidden" id="security-error"></div>
            <button class="btn-secondary" id="back-to-login-btn">← Back to Login</button>
        </div>

        <!-- ================= STEP 3: RESET PASSWORD ================= -->
        <div id="reset-step" class="hidden">
            <div class="logo">🔑 Set New Password</div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new-password-input" placeholder="New password">
            </div>
            <button class="btn-primary" id="reset-password-btn">Save New Password</button>
            <div class="success-text hidden" id="reset-success"></div>
        </div>

    </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
